spring:
  application:
    name: crypto-algo-backend
  r2dbc:
    # DB_SSL_MODE=require for Supabase/managed Postgres; disable for local Docker Postgres
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:crypto_algo}?sslMode=${DB_SSL_MODE:disable}&options=search_path%3D${DB_SCHEMA:quantdcx}
    username: ${DB_USER:crypto}
    password: ${DB_PASSWORD:crypto}
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:crypto_algo}?sslmode=${DB_SSL_MODE:disable}
    user: ${DB_USER:crypto}
    password: ${DB_PASSWORD:crypto}
    locations: classpath:db/migration
    schemas: ${DB_SCHEMA:quantdcx}
    create-schemas: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    # HS256 secret, base64; MUST be overridden in production
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWtleS1jaGFuZ2UtbWUtaW4tcHJvZC0wMTIzNDU2Nzg5}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MIN:30}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:14}
  crypto:
    # base64-encoded 32-byte AES key for encrypting exchange/AI secrets; override in prod
    master-key: ${MASTER_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
  internal:
    # shared token authenticating the Python strategy-engine -> backend signal calls
    token: ${INTERNAL_TOKEN:dev-internal-token-change-me}
  coindcx:
    api-base: https://api.coindcx.com
    public-base: https://public.coindcx.com
  strategy-engine:
    base-url: ${STRATEGY_ENGINE_URL:http://localhost:8000}
  bootstrap:
    # first-run super admin (created only if no users exist)
    email: ${SUPERADMIN_EMAIL:admin@platform.local}
    password: ${SUPERADMIN_PASSWORD:ChangeMe123!}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  pipeline:
    # LIVE: ≥100 closed paper trades and ≥60% win rate.
    # Below 60% WR at the trade sample → reject immediately and regen.
    min-paper-trades: ${PIPELINE_MIN_PAPER_TRADES:100}
    win-rate-threshold: ${PIPELINE_WIN_RATE_THRESHOLD:0.60}
    # Paper ROI % vs stake (secondary LIVE promote signal with WR).
    min-paper-profit-pct: ${PIPELINE_MIN_PAPER_PROFIT_PCT:60}
    backtest-days: ${PIPELINE_BACKTEST_DAYS:30}
    paper-stake: ${PIPELINE_PAPER_STAKE:1000}
    max-open-trades: ${PIPELINE_MAX_OPEN_TRADES:3}
    # Reward:risk must be >= ~1.5:1 so positive expectancy is reachable after
    # fees. Target 2.0% vs stop 1.3% => 1.54:1 (breakeven WR ~39%, vs 60% gate).
    default-stoploss: ${PIPELINE_DEFAULT_STOPLOSS:-0.013}
    default-target-roi: ${PIPELINE_DEFAULT_TARGET_ROI:0.02}
    futures-leverage: ${PIPELINE_FUTURES_LEVERAGE:3}
    max-instruments: ${PIPELINE_MAX_INSTRUMENTS:30}
    # Multiple complementary strategies per coin (mean-reversion / trend / breakout).
    max-strategies-per-instrument: ${PIPELINE_MAX_STRATEGIES_PER_INSTRUMENT:3}
    # Don't recreate the same coin+style right after reject/archive.
    # Soft cooldown after reject — keep short so new styles can keep generating.
    regen-cooldown-hours: ${PIPELINE_REGEN_COOLDOWN_HOURS:4}
    # Need a statistically meaningful sample — 10 trades is noise, not signal.
    min-backtest-trades: ${PIPELINE_MIN_BACKTEST_TRADES:30}
    # Smoke gate into paper (LIVE still needs paper WR/profit). Was 50 — too strict vs AI strategies.
    max-backtest-drawdown-pct: ${PIPELINE_MAX_BACKTEST_DD:85}
    # Backtest must be genuinely profitable — PF>1 and positive net return.
    # PF 0.95 accepted net-losing systems; require a real edge margin after fees.
    min-backtest-win-rate: ${PIPELINE_MIN_BACKTEST_WIN_RATE:0.50}
    min-backtest-profit-pct: ${PIPELINE_MIN_BACKTEST_PROFIT_PCT:2}
    min-backtest-profit-factor: ${PIPELINE_MIN_BACKTEST_PF:1.3}

    max-live-bots: ${PIPELINE_MAX_LIVE_BOTS:10}
    max-wallet-pct: ${PIPELINE_MAX_WALLET_PCT:0.85}
    # Tenant risk policy (not exchange rules): per-asset / per-strategy wallet share.
    # Keep high enough that min-notional (~₹200 at 3x) fits a single LIVE entry.
    max-asset-exposure-pct: ${PIPELINE_MAX_ASSET_EXPOSURE_PCT:0.55}
    max-strategy-exposure-pct: ${PIPELINE_MAX_STRATEGY_EXPOSURE_PCT:0.55}
    # Conservative approx buffer when exchange liquidation metadata is absent.
    liquidation-safety-buffer: ${PIPELINE_LIQ_SAFETY_BUFFER:0.01}
    # Continuous LLM generation cadence (2 minutes).
    auto-gen-ms: ${PIPELINE_AUTO_GEN_MS:120000}
    evaluate-ms: ${PIPELINE_EVALUATE_MS:60000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
