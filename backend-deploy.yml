- name: Test EC2 SSH
  uses: appleboy/ssh-action@v1.2.2
  with:
    host: ${{ secrets.VM_HOST }}
    username: ${{ secrets.VM_USER }}
    port: 22
    key: ${{ secrets.VM_SSH_KEY }}
    timeout: 60s
    command_timeout: 2m
    debug: true
    script: |
      echo "SSH authentication successful"
      echo "User: $(whoami)"
      echo "Host: $(hostname)"
      echo "Directory: $(pwd)"
