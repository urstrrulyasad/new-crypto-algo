name: Deploy Strategy Engine

on:
  push:
    branches:
      - master
    paths:
      - "strategy-engine/**"
      - "docker-compose.gcp.yml"
      - ".github/workflows/strategy-engine-deploy.yml"

# Shares the EC2 host and .env.gcp with the backend deploy — must not overlap.
concurrency:
  group: deploy-vm
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # GHCR image names must be lowercase; owner is derived, never hardcoded.
      - name: Compute image name
        id: img
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$owner/cryptoalgo-strategy-engine" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR (runner)
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Pure-Python image is built ONLY here on the runner. EC2 never builds.
      - name: Build and push strategy-engine image
        run: |
          IMAGE="${{ steps.img.outputs.image }}"
          docker build -f strategy-engine/Dockerfile \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            strategy-engine
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      # Ship only the Compose config (no source) so EC2 stays checkout-free.
      - name: Copy Compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "docker-compose.gcp.yml"
          target: "/home/ubuntu/cryptoalgo"

      - name: Deploy on EC2 (pull + up)
        uses: appleboy/ssh-action@v1
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ github.actor }}
          GHCR_OWNER: ${{ steps.img.outputs.owner }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: GHCR_PAT,GHCR_USER,GHCR_OWNER,IMAGE_TAG
          script: |
            set -e
            cd /home/ubuntu/cryptoalgo

            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            upsert() {
              key="$1"; val="$2"; f=.env.gcp
              touch "$f"
              if grep -q "^${key}=" "$f"; then
                sed -i "s|^${key}=.*|${key}=${val}|" "$f"
              else
                echo "${key}=${val}" >> "$f"
              fi
            }
            upsert GHCR_OWNER "$GHCR_OWNER"
            upsert STRATEGY_ENGINE_TAG "$IMAGE_TAG"

            IMAGE="ghcr.io/$GHCR_OWNER/cryptoalgo-strategy-engine:$IMAGE_TAG"
            docker pull "$IMAGE"

            # No build on EC2: image-only service, recreate just strategy-engine
            # (--no-deps leaves the already-running backend untouched).
            docker compose -f docker-compose.gcp.yml --env-file .env.gcp up -d --no-build --no-deps strategy-engine
            docker compose -f docker-compose.gcp.yml --env-file .env.gcp ps

            cid=$(docker compose -f docker-compose.gcp.yml --env-file .env.gcp ps -q strategy-engine)
            if [ -z "$cid" ]; then echo "strategy-engine container not found"; exit 1; fi
            running=$(docker inspect "$cid" --format '{{.State.Running}}')
            deployed=$(docker inspect "$cid" --format '{{.Config.Image}}')
            echo "strategy-engine running=$running image=$deployed"
            [ "$running" = "true" ]
            [ "$deployed" = "$IMAGE" ]

            docker logout ghcr.io || true
            docker image prune -f
