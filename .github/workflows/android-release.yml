name: Build & Release Android APK

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend API base URL compiled into BuildConfig.DEFAULT_API_BASE"
        required: false
        default: "https://ais-pre-r7dhdzdwvjwd63vrk2iif7-69167419510.asia-east1.run.app"
      release_tag:
        description: "Optional Git tag override for the GitHub Release (auto-generated on every push if empty)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-root-directory: android

      - name: Decode Optional Release Keystore
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
            echo "KEYSTORE_PATH=/tmp/release.keystore" >> "$GITHUB_ENV"
            echo "signing_mode=release-keystore" >> "$GITHUB_OUTPUT"
          else
            echo "signing_mode=debug-fallback" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          API_URL="${{ inputs.api_base_url || vars.API_BASE_URL || 'https://ais-pre-r7dhdzdwvjwd63vrk2iif7-69167419510.asia-east1.run.app' }}"
          VERSION_CODE=$((GITHUB_RUN_NUMBER + 10))
          echo "Compiling APK against API_BASE_URL=$API_URL versionCode=$VERSION_CODE (${{ steps.signing.outputs.signing_mode }})"
          ./gradlew clean assembleRelease \
            -PAPI_BASE_URL="$API_URL" \
            -PVERSION_CODE="$VERSION_CODE" \
            --no-daemon

      - name: Package APK, Release Tag & SHA-256 Checksum
        id: pkg
        run: |
          VERSION_NAME=$(grep -E 'versionName\s*=' android/app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/' | head -n1)
          VERSION_NAME=${VERSION_NAME:-2.0.0}
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ -n "${{ inputs.release_tag }}" ]; then
            RELEASE_TAG="${{ inputs.release_tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="v${VERSION_NAME}-b${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          fi

          SRC_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n1)
          if [ -z "$SRC_APK" ]; then
            echo "ERROR: No release APK found"
            exit 1
          fi
          mkdir -p release-dist
          DEST_APK="release-dist/QuantDCX-${RELEASE_TAG}-release.apk"
          cp "$SRC_APK" "$DEST_APK"
          sha256sum "$DEST_APK" > "${DEST_APK}.sha256"

          echo "version=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "apk_path=${DEST_APK}" >> "$GITHUB_OUTPUT"
          echo "sha_path=${DEST_APK}.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quantdcx-android-apk-${{ steps.pkg.outputs.release_tag }}
          path: release-dist/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: "QuantDCX Android ${{ steps.pkg.outputs.release_tag }}"
          body: |
            Automated Android release APK built from commit `${{ github.sha }}` (build #${{ github.run_number }}).
            - **Backend URL:** `${{ inputs.api_base_url || vars.API_BASE_URL || 'https://ais-pre-r7dhdzdwvjwd63vrk2iif7-69167419510.asia-east1.run.app' }}`
            - **Signing:** `${{ steps.signing.outputs.signing_mode }}`
            - **APK:** `QuantDCX-${{ steps.pkg.outputs.release_tag }}-release.apk`
          generate_release_notes: true
          make_latest: true
          files: |
            ${{ steps.pkg.outputs.apk_path }}
            ${{ steps.pkg.outputs.sha_path }}

      - name: Cleanup Keystore
        if: always()
        run: rm -f /tmp/release.keystore
