name: Deploy Backend

on:
  push:
    branches:
      - master
    paths:
      - "backend/**"
      - "docker-compose.gcp.yml"
      - ".github/workflows/backend-deploy.yml"

# Backend and strategy-engine deploy to the same EC2 host and share .env.gcp,
# so their deploy jobs must never run at the same time.
concurrency:
  group: deploy-vm
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/urstrrulyasad/new-crypto-algo/backend:latest
            ghcr.io/urstrrulyasad/new-crypto-algo/backend:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e

            cd /home/ubuntu/crypto-algo

            export BACKEND_IMAGE_TAG=${{ github.sha }}

            docker compose \
              -f docker-compose.gcp.yml \
              --env-file .env.gcp \
              pull backend

            docker compose \
              -f docker-compose.gcp.yml \
              --env-file .env.gcp \
              up -d backend

            docker image prune -f
