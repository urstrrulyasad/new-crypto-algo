name: Backend CI/CD

on:
  workflow_dispatch:

  push:
    branches:
      - master
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/urstrrulyasad/new-crypto-algo/backend:latest
            ghcr.io/urstrrulyasad/new-crypto-algo/backend:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e

            cd /home/ubuntu/crypto-algo

            export BACKEND_IMAGE_TAG=${{ github.sha }}

            docker compose \
              -f docker-compose.gcp.yml \
              --env-file .env.gcp \
              pull backend

            docker compose \
              -f docker-compose.gcp.yml \
              --env-file .env.gcp \
              up -d backend

            docker image prune -f
