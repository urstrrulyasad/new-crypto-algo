name: Deploy Backend

on:
  push:
    branches:
      - master
    paths:
      - "backend/**"
      - "docker-compose.gcp.yml"
      - ".github/workflows/backend-deploy.yml"

  workflow_dispatch:

concurrency:
  group: deploy-vm
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # Calculate GHCR image name
      # ---------------------------------------------------------
      - name: Compute Image Details
        id: image
        shell: bash
        run: |
          set -e

          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/cryptoalgo-backend"

          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

          echo "GHCR Owner: ${OWNER}"
          echo "GHCR Image: ${IMAGE}"


      # ---------------------------------------------------------
      # Login to GHCR
      # ---------------------------------------------------------
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}


      # ---------------------------------------------------------
      # Build and push backend image
      # ---------------------------------------------------------
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:latest
            ${{ steps.image.outputs.image }}:${{ github.sha }}


      # ---------------------------------------------------------
      # Prepare SSH private key
      # ---------------------------------------------------------
      - name: Prepare SSH Key
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -e

          printf '%s\n' "$VM_SSH_KEY" > /tmp/aws.pem

          chmod 600 /tmp/aws.pem

          echo "Private key fingerprint:"
          ssh-keygen -lf /tmp/aws.pem

          echo ""
          echo "Derived public key fingerprint:"
          ssh-keygen -y -f /tmp/aws.pem > /tmp/aws.pub
          ssh-keygen -lf /tmp/aws.pub

          echo ""
          echo "Key type:"
          awk '{print $1}' /tmp/aws.pub


      # ---------------------------------------------------------
      # Test SSH connection
      # ---------------------------------------------------------
      - name: Test EC2 SSH Connection
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -e

          echo "Testing SSH connection..."
          echo "Host: ${VM_HOST}"
          echo "User: ${VM_USER}"

          ssh \
            -i /tmp/aws.pem \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            "${VM_USER}@${VM_HOST}" \
            "echo SSH_SUCCESS && whoami && hostname && docker --version && docker compose version"


      # ---------------------------------------------------------
      # Deploy backend
      # ---------------------------------------------------------
      - name: Deploy Backend to EC2
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}

          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ github.actor }}

          GHCR_OWNER: ${{ steps.image.outputs.owner }}
          IMAGE_TAG: ${{ github.sha }}

        run: |
          set -e

          echo "Starting EC2 deployment..."

          ssh \
            -i /tmp/aws.pem \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "${VM_USER}@${VM_HOST}" \
            "GHCR_PAT='${GHCR_PAT}' \
             GHCR_USER='${GHCR_USER}' \
             GHCR_OWNER='${GHCR_OWNER}' \
             IMAGE_TAG='${IMAGE_TAG}' \
             bash -s" << 'REMOTE_SCRIPT'

          set -e

          # -----------------------------------------------------
          # Deployment directory
          # -----------------------------------------------------

          DEPLOY_DIR="/home/ubuntu/crypto-algo"

          mkdir -p "$DEPLOY_DIR"

          cd "$DEPLOY_DIR"

          echo "========================================"
          echo "Deployment Directory"
          echo "========================================"

          pwd

          echo ""
          echo "Files:"
          ls -la


          # -----------------------------------------------------
          # Validate required files
          # -----------------------------------------------------

          if [ ! -f ".env.gcp" ]; then
            echo "ERROR: .env.gcp does not exist"
            exit 1
          fi

          if [ ! -f "docker-compose.gcp.yml" ]; then
            echo "ERROR: docker-compose.gcp.yml does not exist"
            exit 1
          fi


          # -----------------------------------------------------
          # Validate Docker
          # -----------------------------------------------------

          echo ""
          echo "Docker:"
          docker --version

          echo ""
          echo "Docker Compose:"
          docker compose version


          # -----------------------------------------------------
          # Login to GHCR
          # -----------------------------------------------------

          echo ""
          echo "Logging into GHCR..."

          echo "$GHCR_PAT" | docker login ghcr.io \
            -u "$GHCR_USER" \
            --password-stdin


          # -----------------------------------------------------
          # Update .env.gcp
          # -----------------------------------------------------

          upsert() {
            KEY="$1"
            VALUE="$2"
            FILE=".env.gcp"

            if grep -q "^${KEY}=" "$FILE"; then
              sed -i "s|^${KEY}=.*|${KEY}=${VALUE}|" "$FILE"
            else
              echo "${KEY}=${VALUE}" >> "$FILE"
            fi
          }

          echo ""
          echo "Updating deployment variables..."

          upsert "GHCR_OWNER" "$GHCR_OWNER"
          upsert "BACKEND_TAG" "$IMAGE_TAG"


          # -----------------------------------------------------
          # Backend image
          # -----------------------------------------------------

          IMAGE="ghcr.io/${GHCR_OWNER}/cryptoalgo-backend:${IMAGE_TAG}"

          echo ""
          echo "========================================"
          echo "Backend Image"
          echo "========================================"

          echo "$IMAGE"


          # -----------------------------------------------------
          # Pull image
          # -----------------------------------------------------

          echo ""
          echo "Pulling backend image..."

          docker pull "$IMAGE"


          # -----------------------------------------------------
          # Validate compose configuration
          # -----------------------------------------------------

          echo ""
          echo "Validating Docker Compose..."

          docker compose \
            -f docker-compose.gcp.yml \
            --env-file .env.gcp \
            config > /tmp/compose-config.yml

          echo "Compose configuration valid."


          # -----------------------------------------------------
          # Deploy backend
          # -----------------------------------------------------

          echo ""
          echo "Deploying backend..."

          docker compose \
            -f docker-compose.gcp.yml \
            --env-file .env.gcp \
            up -d \
            --no-build \
            --no-deps \
            backend


          # -----------------------------------------------------
          # Wait briefly for container startup
          # -----------------------------------------------------

          echo ""
          echo "Waiting for backend container..."

          sleep 5


          # -----------------------------------------------------
          # Show backend status
          # -----------------------------------------------------

          echo ""
          echo "========================================"
          echo "Backend Status"
          echo "========================================"

          docker compose \
            -f docker-compose.gcp.yml \
            --env-file .env.gcp \
            ps backend


          # -----------------------------------------------------
          # Get container ID
          # -----------------------------------------------------

          CID=$(docker compose \
            -f docker-compose.gcp.yml \
            --env-file .env.gcp \
            ps -q backend)

          if [ -z "$CID" ]; then
            echo ""
            echo "ERROR: Backend container was not created."

            docker compose \
              -f docker-compose.gcp.yml \
              --env-file .env.gcp \
              logs --tail 100 backend || true

            exit 1
          fi


          # -----------------------------------------------------
          # Check container state
          # -----------------------------------------------------

          RUNNING=$(docker inspect "$CID" \
            --format '{{.State.Running}}')

          DEPLOYED_IMAGE=$(docker inspect "$CID" \
            --format '{{.Config.Image}}')

          echo ""
          echo "Container ID:"
          echo "$CID"

          echo ""
          echo "Running:"
          echo "$RUNNING"

          echo ""
          echo "Deployed Image:"
          echo "$DEPLOYED_IMAGE"


          # -----------------------------------------------------
          # Verify container running
          # -----------------------------------------------------

          if [ "$RUNNING" != "true" ]; then

            echo ""
            echo "ERROR: Backend container is not running."

            echo ""
            echo "Backend logs:"
            
            docker logs "$CID" --tail 150 || true

            exit 1
          fi


          # -----------------------------------------------------
          # Verify correct image
          # -----------------------------------------------------

          if [ "$DEPLOYED_IMAGE" != "$IMAGE" ]; then

            echo ""
            echo "ERROR: Wrong backend image deployed."

            echo "Expected:"
            echo "$IMAGE"

            echo "Actual:"
            echo "$DEPLOYED_IMAGE"

            exit 1
          fi


          # -----------------------------------------------------
          # Deployment successful
          # -----------------------------------------------------

          echo ""
          echo "========================================"
          echo "BACKEND DEPLOYMENT SUCCESSFUL"
          echo "========================================"

          echo ""
          echo "Image:"
          echo "$DEPLOYED_IMAGE"


          # -----------------------------------------------------
          # Cleanup old images
          # -----------------------------------------------------

          echo ""
          echo "Cleaning unused Docker images..."

          docker image prune -f


          # -----------------------------------------------------
          # Logout GHCR
          # -----------------------------------------------------

          docker logout ghcr.io || true

          REMOTE_SCRIPT


      # ---------------------------------------------------------
      # Cleanup private key
      # ---------------------------------------------------------
      - name: Cleanup SSH Key
        if: always()
        run: |
          rm -f /tmp/aws.pem
          rm -f /tmp/aws.pub
