name: Deploy Backend

on:
  push:
    branches:
      - master
    paths:
      - "backend/**"
      - "docker-compose.gcp.yml"
      - ".github/workflows/backend-deploy.yml"

  workflow_dispatch:

concurrency:
  group: deploy-vm
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Compute Image Details
        id: image
        shell: bash
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/$OWNER/cryptoalgo-backend"

          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"


      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}


      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:latest
            ${{ steps.image.outputs.image }}:${{ github.sha }}


      - name: Test EC2 SSH Connection
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 1m
          script: |
            echo "SSH connection successful"
            whoami
            hostname
            docker --version
            docker compose version


      - name: Deploy Backend to EC2
        uses: appleboy/ssh-action@v1.2.2

        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ github.actor }}
          GHCR_OWNER: ${{ steps.image.outputs.owner }}
          IMAGE_TAG: ${{ github.sha }}

        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 15m

          envs: GHCR_PAT,GHCR_USER,GHCR_OWNER,IMAGE_TAG

          script: |
            set -e

            DEPLOY_DIR="/home/ubuntu/crypto-algo"

            mkdir -p "$DEPLOY_DIR"

            cd "$DEPLOY_DIR"

            echo "Current directory:"
            pwd

            echo "Checking deployment files:"
            ls -la

            if [ ! -f ".env.gcp" ]; then
              echo "ERROR: .env.gcp not found"
              exit 1
            fi

            if [ ! -f "docker-compose.gcp.yml" ]; then
              echo "ERROR: docker-compose.gcp.yml not found"
              exit 1
            fi

            echo "Logging into GHCR..."

            echo "$GHCR_PAT" | docker login ghcr.io \
              -u "$GHCR_USER" \
              --password-stdin

            upsert() {
              key="$1"
              value="$2"
              file=".env.gcp"

              if grep -q "^${key}=" "$file"; then
                sed -i "s|^${key}=.*|${key}=${value}|" "$file"
              else
                echo "${key}=${value}" >> "$file"
              fi
            }

            echo "Updating deployment variables..."

            upsert "GHCR_OWNER" "$GHCR_OWNER"
            upsert "BACKEND_TAG" "$IMAGE_TAG"

            IMAGE="ghcr.io/$GHCR_OWNER/cryptoalgo-backend:$IMAGE_TAG"

            echo "Deploying image:"
            echo "$IMAGE"

            echo "Pulling backend image..."

            docker pull "$IMAGE"

            echo "Starting backend..."

            docker compose \
              -f docker-compose.gcp.yml \
              --env-file .env.gcp \
              up -d \
              --no-build \
              --no-deps \
              backend

            echo "Backend container status:"

            docker compose \
              -f docker-compose.gcp.yml \
              --env-file .env.gcp \
              ps backend

            CID=$(docker compose \
              -f docker-compose.gcp.yml \
              --env-file .env.gcp \
              ps -q backend)

            if [ -z "$CID" ]; then
              echo "ERROR: Backend container was not created"
              exit 1
            fi

            RUNNING=$(docker inspect "$CID" \
              --format '{{.State.Running}}')

            DEPLOYED_IMAGE=$(docker inspect "$CID" \
              --format '{{.Config.Image}}')

            echo "Container ID: $CID"
            echo "Running: $RUNNING"
            echo "Image: $DEPLOYED_IMAGE"

            if [ "$RUNNING" != "true" ]; then
              echo "ERROR: Backend container is not running"

              docker logs "$CID" --tail 100 || true

              exit 1
            fi

            if [ "$DEPLOYED_IMAGE" != "$IMAGE" ]; then
              echo "ERROR: Wrong backend image deployed"
              exit 1
            fi

            echo "Backend deployment successful"

            docker image prune -f

            docker logout ghcr.io || true
