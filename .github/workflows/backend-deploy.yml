name: Deploy Backend

on:
  push:
    branches:
      - master
    paths:
      - "backend/**"
      - "docker-compose.gcp.yml"
      - ".github/workflows/backend-deploy.yml"

  workflow_dispatch:

concurrency:
  group: deploy-vm
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compute Image Details
        id: image
        shell: bash
        run: |
          set -euo pipefail

          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/cryptoalgo-backend"

          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:latest
            ${{ steps.image.outputs.image }}:${{ github.sha }}

      - name: Prepare SSH Key
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${VM_SSH_KEY}" ]; then
            echo "ERROR: VM_SSH_KEY is empty"
            exit 1
          fi

          printf '%s\n' "$VM_SSH_KEY" > /tmp/aws.pem
          chmod 600 /tmp/aws.pem

          echo "SSH key fingerprint:"
          ssh-keygen -lf /tmp/aws.pem

          ssh-keygen -y -f /tmp/aws.pem > /tmp/aws.pub

          echo "Derived public key fingerprint:"
          ssh-keygen -lf /tmp/aws.pub

      - name: Test EC2 SSH Connection
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail

          : "${VM_HOST:?VM_HOST is missing}"
          : "${VM_USER:?VM_USER is missing}"

          ssh \
            -i /tmp/aws.pem \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            "${VM_USER}@${VM_HOST}" \
            "echo SSH_SUCCESS && whoami && hostname && docker --version && docker compose version"

      - name: Deploy Backend to EC2
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ github.actor }}
          GHCR_OWNER: ${{ steps.image.outputs.owner }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          : "${VM_HOST:?VM_HOST is missing}"
          : "${VM_USER:?VM_USER is missing}"
          : "${GHCR_PAT:?GHCR_PAT is missing}"
          : "${GHCR_OWNER:?GHCR_OWNER is missing}"
          : "${IMAGE_TAG:?IMAGE_TAG is missing}"

          ssh \
            -i /tmp/aws.pem \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "${VM_USER}@${VM_HOST}" \
            "GHCR_PAT='${GHCR_PAT}' \
             GHCR_USER='${GHCR_USER}' \
             GHCR_OWNER='${GHCR_OWNER}' \
             IMAGE_TAG='${IMAGE_TAG}' \
             bash -se" << 'REMOTE_SCRIPT'

          set -euo pipefail

          DEPLOY_DIR="/home/ubuntu/crypto-algo"

          cd "$DEPLOY_DIR"

          test -f ".env.gcp"
          test -f "docker-compose.gcp.yml"

          docker --version
          docker compose version

          echo "$GHCR_PAT" | docker login ghcr.io \
            -u "$GHCR_USER" \
            --password-stdin

          upsert() {
            KEY="$1"
            VALUE="$2"
            FILE=".env.gcp"

            if grep -q "^${KEY}=" "$FILE"; then
              sed -i "s|^${KEY}=.*|${KEY}=${VALUE}|" "$FILE"
            else
              echo "${KEY}=${VALUE}" >> "$FILE"
            fi
          }

          upsert "GHCR_OWNER" "$GHCR_OWNER"
          upsert "BACKEND_TAG" "$IMAGE_TAG"

          IMAGE="ghcr.io/${GHCR_OWNER}/cryptoalgo-backend:${IMAGE_TAG}"

          echo "Deploying image: $IMAGE"

          docker pull "$IMAGE"

          docker compose \
            -f docker-compose.gcp.yml \
            --env-file .env.gcp \
            config > /tmp/backend-compose.yml

          docker compose \
            -f docker-compose.gcp.yml \
            --env-file .env.gcp \
            up -d \
            --no-build \
            --no-deps \
            backend

          sleep 10

          CID=$(docker compose \
            -f docker-compose.gcp.yml \
            --env-file .env.gcp \
            ps -q backend)

          if [ -z "$CID" ]; then
            echo "ERROR: Backend container was not created"
            exit 1
          fi

          RUNNING=$(docker inspect "$CID" --format '{{.State.Running}}')
          DEPLOYED_IMAGE=$(docker inspect "$CID" --format '{{.Config.Image}}')

          echo "Running: $RUNNING"
          echo "Image: $DEPLOYED_IMAGE"

          if [ "$RUNNING" != "true" ]; then
            echo "ERROR: Backend container is not running"
            docker logs "$CID" --tail 200 || true
            exit 1
          fi

          if [ "$DEPLOYED_IMAGE" != "$IMAGE" ]; then
            echo "ERROR: Wrong backend image deployed"
            echo "Expected: $IMAGE"
            echo "Actual:   $DEPLOYED_IMAGE"
            exit 1
          fi

          docker compose \
            -f docker-compose.gcp.yml \
            --env-file .env.gcp \
            ps backend

          docker image prune -f
          docker logout ghcr.io || true

          echo "BACKEND DEPLOYMENT SUCCESSFUL"

          REMOTE_SCRIPT

      - name: Cleanup SSH Key
        if: always()
        run: |
          rm -f /tmp/aws.pem
          rm -f /tmp/aws.pub
