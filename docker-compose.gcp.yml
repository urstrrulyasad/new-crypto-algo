# EC2 deploy: backend + strategy-engine against Supabase (no local Postgres/frontend).
# Images are built and pushed to GHCR by GitHub Actions; the VM only pulls them.
# GHCR_OWNER, BACKEND_TAG and STRATEGY_ENGINE_TAG are written into .env.gcp by the
# deploy workflows (SHA-pinned). Usage on the VM (normally run by CI):
#   docker compose -f docker-compose.gcp.yml --env-file .env.gcp up -d --no-build
services:
  backend:
    image: ghcr.io/${GHCR_OWNER}/cryptoalgo-backend:${BACKEND_TAG:-latest}
    restart: unless-stopped

    environment:
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xmx384m -Xms128m}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-postgres}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: ${DB_SCHEMA:-quantdcx}
      DB_SSL_MODE: ${DB_SSL_MODE:-require}
      JWT_SECRET: ${JWT_SECRET}
      MASTER_KEY: ${MASTER_KEY}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-admin@platform.local}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
      STRATEGY_ENGINE_URL: http://strategy-engine:8000
      CORS_ORIGINS: ${CORS_ORIGINS}
      PIPELINE_MAX_STRATEGIES_PER_INSTRUMENT: ${PIPELINE_MAX_STRATEGIES_PER_INSTRUMENT:-3}
    ports:
      - "8080:8080"

  strategy-engine:
    image: ghcr.io/${GHCR_OWNER}/cryptoalgo-strategy-engine:${STRATEGY_ENGINE_TAG:-latest}
    restart: unless-stopped

    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      BACKEND_URL: http://backend:8080
      SIGNAL_POLL_SECONDS: ${SIGNAL_POLL_SECONDS:-60}
    depends_on:
      - backend
    # Keep engine private on the VM; only backend is public
    ports:
      - "127.0.0.1:8000:8000"
